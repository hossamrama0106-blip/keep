<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قطار اليوم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>قطار اليوم</title>
<style>
:root{
  --bg:#14181f;--card:#1d232d;--card2:#262d3a;--text:#e9edf3;--mute:#8d98aa;--line:#2f384a;
  --green:#3fbf7f;--yellow:#e6b94a;--red:#e5604d;--blue:#5b9cf0;
  --okbg:#1f3a2e;--acc:#3fbf7f;--acc2:#5b9cf0;--onacc:#06120b;--r:18px;
  --sh:0 14px 34px -16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  --aur:radial-gradient(60% 45% at 100% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%),
        radial-gradient(55% 40% at 0% 22%,color-mix(in srgb,var(--acc2) 20%,transparent),transparent 70%),
        radial-gradient(50% 40% at 50% 100%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:"Tajawal","Segoe UI",system-ui,Tahoma,sans-serif;line-height:1.6;padding:18px 16px 140px;max-width:640px;margin-inline:auto}
body::before,.ov::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--aur);pointer-events:none}
body::before{animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.18) translate(-2%,3%)}}
h1{font-size:21px;margin:0;font-weight:800}
h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
h2::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}

/* أزرار ومدخلات */
button{font:inherit;font-weight:500;color:inherit;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:16px;padding:13px 16px;background:color-mix(in srgb,var(--card2) 88%,transparent);cursor:pointer;min-height:48px;transition:transform .15s,background .25s,box-shadow .25s,border-color .25s}
button:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
button:active{transform:scale(.97)}
button:disabled{cursor:not-allowed}
.small{padding:8px 13px;min-height:38px;font-size:13px;border-radius:13px}
input,select,textarea{background:color-mix(in srgb,var(--card2) 85%,transparent);color:var(--text);border:1px solid transparent;border-radius:14px;padding:12px;font:inherit;transition:border-color .2s,box-shadow .2s}
textarea{width:100%;min-height:64px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=range]{width:100%;padding:0;accent-color:var(--acc)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);vertical-align:middle}
.primary{position:relative;overflow:hidden;width:100%;font-size:18px;font-weight:800;color:var(--onacc);border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 28px -10px color-mix(in srgb,var(--acc) 75%,transparent);min-height:56px;border-radius:18px}
.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(120%);animation:shine 4.5s infinite}
@keyframes shine{0%,60%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.primary:disabled{filter:grayscale(.6);box-shadow:none}.primary:disabled::after{display:none}

/* بطاقات */
.card{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 86%,white 14%),var(--card) 65%);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.alert{border-inline-start:4px solid var(--acc)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.msg{background:color-mix(in srgb,var(--card2) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:16px;padding:14px;margin:14px 0;text-align:right}
.chip{display:inline-block;background:color-mix(in srgb,var(--card2) 85%,transparent);border-radius:20px;padding:4px 11px;font-size:13px;margin:2px}
.pre{white-space:pre-wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.acts{text-align:right;margin:10px 0;padding:0;list-style:none}
.acts li{background:color-mix(in srgb,var(--card2) 75%,transparent);border-radius:14px;padding:12px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:right;margin-bottom:8px}
.prog{height:8px;border-radius:5px;background:var(--card2);margin:6px 0;overflow:hidden}
.prog i,.hb{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.hb{height:14px;border-radius:7px;min-width:4px}
.bub{padding:11px 14px;border-radius:16px;margin-bottom:8px;white-space:pre-wrap;max-width:92%}
.bub.user{background:var(--card2);margin-right:auto;margin-left:0}
.bub.assistant{background:var(--okbg)}.act{font-size:12px;color:var(--yellow);margin-top:6px}
.flash{animation:fl .6s}@keyframes fl{0%{background:var(--green)}100%{background:var(--card)}}

/* الرأس */
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px}
.brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.hello{font-size:28px;font-weight:800;line-height:1.25;background:linear-gradient(90deg,var(--text) 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hright{display:flex;flex-direction:column;align-items:center;gap:8px}
.veh{font-size:34px;filter:drop-shadow(0 6px 10px #0006);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.dots{display:flex;gap:5px}.dot{width:10px;height:10px;border-radius:50%;background:var(--card2)}
.dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}.dot.half{background:var(--yellow)}

/* البطل: الحصة الحالية */
.hero{position:relative;border-radius:calc(var(--r) + 8px);padding:20px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 34%,var(--card)),color-mix(in srgb,var(--acc2) 26%,var(--card)) 75%);
  border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 24px 54px -22px color-mix(in srgb,var(--acc) 65%,transparent)}
.hero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;left:-90px;top:-110px;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:14px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.04em;color:color-mix(in srgb,var(--text) 72%,transparent)}
.hero-title{font-size:24px;font-weight:800;line-height:1.3;display:flex;align-items:center;margin-top:6px}
.hero-ic{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;margin-inline-end:10px;background:rgba(255,255,255,.18);font-size:26px;flex:none;backdrop-filter:blur(6px)}
.hero .msg{background:color-mix(in srgb,var(--bg) 42%,transparent);margin:14px 0}
.ring{width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),color-mix(in srgb,var(--text) 16%,transparent) 0)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:color-mix(in srgb,var(--card) 92%,transparent)}
.ring>div{position:relative;text-align:center;line-height:1.1}.ring b{font-size:20px;display:block;font-weight:800}.ring small{font-size:10px;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:20px;background:color-mix(in srgb,var(--bg) 50%,transparent);margin:14px 0}
.mode{padding:10px 4px;text-align:center;font-size:12px;border:0;background:transparent;color:var(--mute);border-radius:15px;min-height:56px}
.mode b{display:block;font-size:14px;font-weight:700}
.mode.sel{color:#08140d;font-weight:800;box-shadow:0 8px 20px -8px #0009}
.mode.sel.g{background:linear-gradient(135deg,#34c985,#8be0b0)}
.mode.sel.y{background:linear-gradient(135deg,#e6b94a,#f6dc8a)}
.mode.sel.r{background:linear-gradient(135deg,#ff6b57,#ffa08f)}

/* إحصاءات سريعة */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{display:block;border-radius:var(--r);padding:12px 4px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 86%,white 14%),var(--card));border:1px solid color-mix(in srgb,var(--line) 85%,transparent);box-shadow:var(--sh);min-height:0;color:inherit}
.stat .si{font-size:20px;display:block}.stat b{display:block;font-size:20px;font-weight:800;line-height:1.2}.stat small{color:var(--mute);font-size:11px}

/* مسار اليوم */
.tl{position:relative}
.tli{display:flex;gap:13px;align-items:center;padding:9px 0;position:relative}
.tli:not(:last-child)::after{content:"";position:absolute;inset-inline-start:19px;top:48px;bottom:-9px;width:2px;background:var(--line)}
.tli.done:not(:last-child)::after{background:linear-gradient(var(--acc),var(--line))}
.dotc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card2);flex:none;z-index:1;border:2px solid var(--line)}
.tli.done .dotc{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:var(--onacc);font-weight:800}
.tli.now .dotc{border-color:var(--acc);animation:pulse 2s infinite}
.tli.locked,.tli.skipped{opacity:.55}
.tli.done .tlt b{opacity:.75}
.tlt{flex:1;min-width:0}.tlt b{display:block;font-weight:700;font-size:15px}
.tls{font-size:12px;color:var(--mute);white-space:nowrap}
.tli.now .tls{color:var(--acc);font-weight:800}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* حكمة اليوم */
.quote{background:linear-gradient(135deg,color-mix(in srgb,var(--acc2) 22%,var(--card)),var(--card) 80%);overflow:hidden}
.quote::before{content:"❝";position:absolute;left:12px;top:-6px;font-size:90px;opacity:.12;line-height:1}
.qt{font-size:18px;font-weight:500;line-height:1.75;position:relative}

/* وقود وماء */
.fuel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fuel button{text-align:right;border:2px solid transparent;font-size:14px}
.fuel button.on{border-color:var(--acc);background:var(--okbg)}

/* بلاطات الأدوات */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px;border-radius:var(--r);min-height:0;text-align:center;
  background:linear-gradient(160deg,hsl(var(--h) 85% 62%/.24),hsl(var(--h) 85% 55%/.05));border:1px solid hsl(var(--h) 80% 60%/.3)}
.tile .ti{font-size:26px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:hsl(var(--h) 85% 60%/.26);box-shadow:inset 0 1px 0 #fff3}
.tile b{font-size:13px;font-weight:700}.tile small{color:var(--mute);font-size:11px;min-height:15px}
.tile:hover{transform:translateY(-3px);border-color:hsl(var(--h) 85% 65%/.6);box-shadow:0 12px 24px -12px hsl(var(--h) 85% 55%/.6)}
.tile.hot{border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 25%,transparent)}
.tiles.big{grid-template-columns:repeat(2,1fr)}.tiles.big .tile{flex-direction:row;text-align:right;padding:14px;gap:12px}
.tiles.big .tile>span:last-child{display:flex;flex-direction:column;align-items:flex-start}

/* التنقل السفلي وزر الطوارئ */
#nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:28px;z-index:9;width:min(560px,calc(100% - 24px));
  background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid color-mix(in srgb,var(--line) 90%,transparent);box-shadow:0 18px 44px -12px rgba(0,0,0,.7)}
#nav button{flex:1;background:transparent;border:0;min-height:54px;padding:6px 2px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mute);font-weight:700}
#nav button i{font-style:normal;font-size:21px;line-height:1.2;transition:transform .25s}
#nav button.on{color:var(--text);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 32%,transparent),color-mix(in srgb,var(--acc2) 24%,transparent))}
#nav button.on i{transform:translateY(-2px) scale(1.15)}
#sosBtn{position:fixed;left:14px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;min-height:0;border-radius:50%;padding:0;z-index:9;color:#fff;font-weight:800;border:0;
  background:linear-gradient(135deg,#ff6b57,#e5384d);box-shadow:0 12px 28px -6px rgba(229,56,77,.7);animation:sosp 3.2s infinite;display:flex;align-items:center;justify-content:center}
#sosBtn .sosic{font-size:24px}#sosBtn .soslbl{display:none}
@keyframes sosp{0%{box-shadow:0 12px 28px -6px rgba(229,56,77,.7),0 0 0 0 rgba(229,56,77,.5)}70%{box-shadow:0 12px 28px -6px rgba(229,56,77,.7),0 0 0 14px rgba(229,56,77,0)}100%{box-shadow:0 12px 28px -6px rgba(229,56,77,.7),0 0 0 0 rgba(229,56,77,0)}}

/* الطبقات (حصة، طوارئ، لوحات) */
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;padding:20px 20px 120px;display:none;overflow:auto}
.ov.show{display:block}.ov.show .inner{animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.ov .inner{max-width:560px;margin:0 auto;text-align:center}
.ov .inner>.row:first-child{position:sticky;top:-20px;z-index:3;padding:14px 0;margin-top:-20px;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.big{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;margin:18px 0;line-height:1.1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#night{background:#000;z-index:20}#night::before{display:none}#night .inner{padding-top:12vh}
.moods{display:flex;gap:8px;justify-content:center;margin:16px 0}
.moods button{font-size:28px;padding:10px 12px;background:var(--card2)}

/* ملاحظات وتقويم */
.ngrid{columns:2;column-gap:10px}
.nc{break-inside:avoid;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;position:relative;cursor:pointer;overflow-wrap:anywhere;transition:transform .2s,box-shadow .2s}
.nc:hover{transform:translateY(-2px);box-shadow:0 12px 24px -14px #000c}
.nc .npin{position:absolute;left:8px;top:6px;font-size:12px}
.nc .ni{padding:2px 0}.nc .ni.nd{text-decoration:line-through;opacity:.55}.nc .nb{margin-top:4px}
.cdots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cdot{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}.cdot.sel{border-color:#fff}
.tabon{border:2px solid var(--acc)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.heat i{aspect-ratio:1;border-radius:7px;background:var(--card2)}
.heat i.on{background:var(--acc)}.heat i.half{background:var(--yellow)}

/* دخول ناعم عند فتح التطبيق */
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}}
.boot .colA>*,.boot .colB>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
.boot .colA>*:nth-child(2),.boot .colB>*:nth-child(1){animation-delay:.08s}
.boot .colA>*:nth-child(3),.boot .colB>*:nth-child(2){animation-delay:.16s}
.boot .colA>*:nth-child(4),.boot .colB>*:nth-child(3){animation-delay:.24s}
.boot .colB>*:nth-child(4){animation-delay:.32s}.boot .colB>*:nth-child(5){animation-delay:.4s}.boot .colB>*:nth-child(n+6){animation-delay:.48s}

/* الحاسوب */
@media(min-width:700px){
  #sosBtn{width:auto;border-radius:30px;padding:0 22px;height:56px;bottom:28px;left:28px}
  #sosBtn .soslbl{display:inline;margin-inline-start:8px;font-size:15px}
}
@media(min-width:980px){
  body{max-width:1180px;padding:30px 32px 140px}
  #app{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
  .hello{font-size:36px}.hero{padding:28px}.hero-title{font-size:30px}.ring{width:108px;height:108px}.ring b{font-size:26px}
  .ov .inner{max-width:780px}.ngrid{columns:3}
  #nav{width:520px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="boot">
<header>
  <div><div class="brand">قطار اليوم</div><div class="hello" id="hello"></div><div class="mute" id="dateTxt"></div></div>
  <div class="hright"><span class="veh" id="veh">🚂</span><div class="dots" id="week" title="آخر 7 أيام"></div></div>
</header>

<div id="app"></div>

<button id="sosBtn" aria-label="طوارئ"><span class="sosic">🆘</span><span class="soslbl">طوارئ: رغبة ملحّة / هبوط</span></button>
<nav id="nav">
  <button data-nav="home"><i>🏠</i>الرئيسية</button>
  <button data-nav="notes"><i>📝</i>ملاحظات</button>
  <button data-nav="check"><i>📊</i>حالتي</button>
  <button data-nav="coach"><i>🤖</i>المدرب</button>
  <button data-nav="more"><i>☰</i>المزيد</button>
</nav>

<!-- Run overlay -->
<div class="ov" id="run"><div class="inner" id="runIn"></div></div>
<!-- SOS overlay -->
<div class="ov" id="sos"><div class="inner" id="sosIn"></div></div>
<!-- Night -->
<div class="ov" id="night"><div class="inner" id="nightIn"></div></div>
<!-- Panel -->
<div class="ov" id="pg" style="z-index:8"><div class="inner" id="pgIn" style="text-align:right"></div></div>
<!-- Ideas -->
<div class="ov" id="ideas"><div class="inner" id="ideasIn"></div></div>
<!-- Lock -->
<div class="ov" id="lock" style="z-index:60"><div class="inner" id="lockIn"></div></div>

<script>
"use strict";
/* ============ إعدادات الحصص (قابلة للتعديل هنا فقط) ============ */
const NIGHT_START = "21:30", NIGHT_END = "06:15";
const LOCK_DAYS = 5;          // الإنجليزية مقفلة في المستوى التمهيدي
const CAFFEINE_CUTOFF = 14;   // لا كافيين بعد هذه الساعة
const SWEEP_DAYS = [0,2,4];   // أيام الكنس/المسح (أحد، ثلاثاء، خميس)
function isDoctorDay(dt){
  const k=dkey(dt),o=S.doctorOn&&S.doctorOn[k];
  if(o===true||o===false)return o;
  if(dt.getDay()!==3||!S.doctorAnchor)return false;
  const w=Math.round((new Date(k)-new Date(S.doctorAnchor))/(7*864e5));
  return w%2===0;
}
function blocksFor(dt){
  const sweep=SWEEP_DAYS.includes(dt.getDay());
  return [
  {id:"launch", ic:"🌅", name:"الإقلاع والوقود الأول", t:"6:00–7:00 ص", plain:true,
    desc:"ماء + إفطار بروتين + الدواء الصباحي، ثم الذهاب للعمل. لا مهام ثقيلة الآن — الخمول الصباحي مع الدواء طبيعي."},

const KEY="train.v1";
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S)S={start:today(),days:{},ideas:[],run:null,sos:null,sel:{}};
  norm();}
function norm(){S.days=S.days||{};S.ideas=S.ideas||[];S.sel=S.sel||{};S.profile=S.profile||{};S.dreams=S.dreams||[];S.weekly=S.weekly||{};S.over=S.over||{mins:{}};S.over.mins=S.over.mins||{};S.ai=S.ai||{};S.skin=S.skin||{mode:"auto"};S.notes=S.notes||[];S.meds=S.meds||[];S.ocd=S.ocd||[];S.wins=S.wins||[];S.docQs=S.docQs||"";S.vault=S.vault||{};S.vault.spent=S.vault.spent||[];S.rem=S.rem||{on:false,items:{}};S.rem.items=S.rem.items||{};}
function save(){S.updatedAt=Date.now();S.lastOpen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushSoon();cfgSoon()}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayNum(){return Math.floor((new Date(today())-new Date(S.start))/864e5)+1}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function day(){const k=logicalDay();const d=S.days[k]||(S.days[k]={blocks:{},fuel:[0,0,0,0],mood:null,sos:0,sosWins:0});
  d.checks=d.checks||[];d.meds=d.meds||{};d.water=d.water||0;return d}
function logicalDay(){return today()}
const $=id=>document.getElementById(id);
function setHTML(el,key,html){if(el.dataset.k!==key){el.innerHTML=html;el.dataset.k=key;return true}return false}
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b}
function isNight(){const d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=toMin(NIGHT_START)||m<toMin(NIGHT_END)}

/* ============ صوت واهتزاز ============ */
let actx;
function beep(n=1){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    o.frequency.value=660+i*220;const t=actx.currentTime+i*.22;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[120,60,120]:120)}catch(e){}}

/* ============ المنطق ============ */
function points(){const d=day();let p=0;B().forEach(b=>{const r=d.blocks[b.id];if(r&&r.status==="done"&&!b.fun)p+=MODES[r.mode].pts});return p}
const MAXP=12;
function currentBlock(){const d=day();return B().find(b=>!d.blocks[b.id]&&!b.locked)}
function finishBlock(id,mode,status="done"){day().blocks[id]={status,mode};if(status==="done")day().last=id;S.run=null;save();render()}
function modeMinutes(b,m){const o=S.over&&S.over.mins&&S.over.mins[b.id];if(o&&o[m])return o[m];return b.mins?b.mins[m]:b.meal?MEAL_MIN[m]:MODES[m].min}
function modeRounds(b,m){return b.rounds?b.rounds[m]:b.meal?1:MODES[m].rounds}

/* ============ جلسة الحصة ============ */
function startRun(b,mode){S.run={id:b.id,mode,round:1,endAt:0,between:false,pre:true};save();tick()}
function renderRun(){
  const r=S.run,ov=$("run");
  if(!r){ov.classList.remove("show");$("runIn").dataset.k="";return}
  const b=B().find(x=>x.id===r.id),n=modeRounds(b,r.mode);
  ov.classList.add("show");
  if(r.pre){
    if(!setHTML($("runIn"),"pre"+r.id,`<div class="mute">${b.ic} ${b.name}</div><h1>مرساة البدء: ٣ خطوات صغيرة</h1>
      <ul class="acts">${anchorsFor(b.id).map(a=>`<li>${a}</li>`).join("")}</ul>
      <div class="msg">لا تفكر في الحصة كلها. نفّذ الأولى فقط ثم اضغط.</div>
      <button class="primary" id="preGo">▶ جاهز، ابدأ العدّاد</button><p><button class="small" id="preX">إلغاء</button></p>`))return;
    $("preGo").onclick=()=>{r.pre=false;r.endAt=Date.now()+modeMinutes(b,r.mode)*60000;save();tick()};
    $("preX").onclick=()=>{S.run=null;save();render();renderRun()};
    return}
  if(r.between){
    if(!setHTML($("runIn"),"b"+r.round,`<div class="big">✅</div><h1>انتهت الجولة ${r.round} من ${n}</h1>
      <div class="msg">⚡ تم شحن البطارية. خذ نفساً وماءً ثم أكمل.</div>
      <button class="primary" id="nextR">▶ الجولة ${r.round+1}</button>
      <p><button id="endR" class="small">أنهي الحصة هنا ✅</button></p>`))return;
    $("nextR").onclick=()=>{r.round++;r.between=false;r.endAt=Date.now()+modeMinutes(b,r.mode)*60000;save();tick()};
    $("endR").onclick=()=>finishBlock(r.id,r.mode);
    return;
  }
  const left=(r.endAt-Date.now())/1000;
  const rk="t"+r.id+r.round;
  if(!setHTML($("runIn"),rk,`<div class="mute">${b.ic} ${b.name} — ${MODES[r.mode].em} ${MODES[r.mode].label}${n>1?` — جولة ${r.round}/${n}`:""}</div>
    <div class="big">${mmss(left)}</div>
    <div class="msg">${b[r.mode]}</div>
    <div class="row" style="margin:10px 0"><input id="runCap" class="grow" placeholder="⚡ فكرة طارئة؟ دوّنها وارجع"><button class="small" id="runCapB">حفظ</button></div>
    <div class="row"><button class="grow" id="stopR">⏹ إيقاف (بلا ذنب)</button><button class="grow" id="doneR">✅ خلصت</button></div>`)){const bg=$("runIn").querySelector(".big");if(bg)bg.textContent=mmss(left);return}
  const cap=()=>{const v=$("runCap").value.trim();if(v&&addQuick("⚡ "+v)){$("runCap").value="";$("runCap").placeholder="✅ حُفظت، عد لمهمتك"}};
  $("runCapB").onclick=cap;$("runCap").onkeydown=e=>{if(e.key==="Enter")cap()};
  $("stopR").onclick=()=>{S.run=null;save();render();renderRun()};
  $("doneR").onclick=()=>{beep(2);finishBlock(r.id,r.mode);};
}
function runTick(){
  const r=S.run;if(!r||r.between||r.pre)return;
  if(Date.now()>=r.endAt){const b=B().find(x=>x.id===r.id),n=modeRounds(b,r.mode);
    if(r.round>=n){beep(3);finishBlock(r.id,r.mode);}else{beep(2);r.between=true;save();}}
}

function renderNight(){
  const ov=$("night");
  if(!isNight()){ov.classList.remove("show");return}
  ov.classList.add("show");
  if(S.sos){$("night").style.zIndex=9;return}else{$("night").style.zIndex=20}
  const d=day(),el=$("nightIn");
  const key=el.dataset.k;
  const k=d.mood===null&&new Date().getHours()>=12?"mood":"sleep";
  if(key===k)return; el.dataset.k=k;
  if(k==="mood"){
    el.innerHTML=`<h2>تقييم اليوم — ١٠ ثوانٍ فقط، مرة واحدة</h2>
     <div class="moods">${["😞","😕","😐","🙂","😄"].map((e,i)=>`<button data-m="${i+1}">${e}</button>`).join("")}</div>`;
    el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{d.mood=+b.dataset.m;save();el.dataset.k="";renderNight()});
  }else{
    el.innerHTML=`<div style="font-size:40px;opacity:.5">🌙</div><p style="color:#555">وقت الإغلاق حتى ${NIGHT_END}.<br>لا فحص مشاعر ولا حسابات. أنجزت ما يكفي.</p>

  }
}

  h+=CAPS.map(c=>{const a=answered(c.id);return `<div class="card"><div class="row"><div class="grow"><b>${c.ic} ${c.name}</b><div class="prog"><i style="width:${a*10}%"></i></div><div class="mute">${a}/10</div></div><button class="small" data-cap="${c.id}">${a>=10?"مراجعة":a?"أكمل":"ابدأ"}</button></div></div>`}).join("");
  if(answered(1)>=10&&aiOn())h+=`<p><button class="primary" id="persBtn">🤖 اطلب من المدرب تخصيص خطتي الآن</button></p>`;
  h+=`<p><button class="small" id="wipe">حذف الملف بالكامل</button></p>`;

  $("pgIn").querySelectorAll("[data-cap]").forEach(b=>b.onclick=()=>{const c=+b.dataset.cap;let i=0;while(i<10&&S.profile["q"+((c-1)*10+i+1)])i++;QS={cap:c,i:i>=10?0:i};PG="q";drawPanel()});
  $("wipe").onclick=()=>{if(confirm("حذف كل إجاباتك؟")){S.profile={};save();drawPanel()}};
  if($("persBtn"))$("persBtn").onclick=()=>{PG="coach";sendCoach("اقرأ ملفي الشخصي وخصّص خطتي: عدّل مدد الحصص أو أوضاعها حيث يلزم ونفّذ ذلك بالأدوات، ثم لخّص ما غيّرته.")};
}
function pQ(){
  const c=CAPS[QS.cap-1];
  if(QS.i>=10){beep(3);
    if(QS.cap===1&&!S.cap1Done){S.cap1Done=true;S.coachMsg={text:"تم حفظ بصمتك الجسدية والوقود. جدولك المبدئي يعمل الآن؛ أكمل بقية الكبسولات متى شئت (كلها اختيارية).",day:today()};save();confetti();closePanel();return}
    PG="profile";drawPanel();return}
  const n=(QS.cap-1)*10+QS.i+1,q=c.qs[QS.i],prev=S.profile["q"+n];
  let h=head(c.ic+" "+c.name)+`<div class="prog"><i style="width:${QS.i*10}%"></i></div><div class="mute">سؤال ${QS.i+1} من 10</div><div class="card"><div style="font-size:19px;margin:6px 0 12px">${q.q}</div>`;
  if(q.o)h+=q.o.map((o,k)=>`<button class="opt" data-o="${k}">${o}</button>`).join("");
  else h+=`<input id="qa" type="${q.t==="n"?"number":"text"}" value="${prev?esc(prev.a):""}" style="width:100%"><button class="primary" id="qok" style="margin-top:8px">التالي</button>`;
  h+=`</div><div class="row"><button class="small grow" id="qskip">تخطَّ</button><button class="small grow" id="qexit">حفظ والخروج</button></div>`;
  setPg(h);
  const ans=a=>{S.profile["q"+n]={q:q.q,a};save();QS.i++;drawPanel()};
  $("pgIn").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>ans(q.o[+b.dataset.o]));
  if($("qok"))$("qok").onclick=()=>{const v=$("qa").value.trim();if(v)ans(v);else{QS.i++;drawPanel()}};
  $("qskip").onclick=()=>{QS.i++;drawPanel()};

}

const VERD={realistic:"🟢 واقعي",huge:"🟠 ضخم",escape:"🔴 هروب من مهام اليوم",unrated:"⚪ لم يُقيَّم آلياً"};
function dreamCard(d){
  let b="";
  if(d.state==="incubating"){const hrs=Math.max(1,Math.ceil((d.at+DREAM_MS-Date.now())/3600000));
    b=`<div class="mute">🔒 تُفتح بعد ${hrs} ساعة. الفص الجبهي الآن في حالة اندفاع دوبامين — سنناقشها بعد 72 ساعة للتأكد أنها رغبة حقيقية وليست هروباً من مهام اليوم.</div>`}
  else if(d.state==="ready")b=`<div>⏰ مرّت 72 ساعة. هل ما زلت تريد هذا الهدف بنفس الحماس بعد أن هدأ الدوبامين؟</div><div class="row" style="margin-top:8px"><button class="grow" data-yes="${d.id}">نعم، ما زلت أريده</button><button class="grow" data-no="${d.id}">لا، كانت نزوة</button></div>`;
  else if(d.state==="analyzing")b=`<div class="mute">⏳ جارٍ التحليل…</div>`;
  else if(d.state==="dropped")b=`<div class="mute">🗑️ كانت نزوة — تُركت دون ذنب. هذا قرار ناجح.</div>`;
  else b=`<div><b>${VERD[d.verdict]||d.verdict}</b></div><div class="pre" style="margin:6px 0">${esc(d.reason)}</div>`+(d.steps||[]).map(x=>`<div class="msg">⚛️ ${esc(x.text)}<div class="mute">${x.minutes} دقيقة فقط · ${esc(x.when||"")}</div></div>`).join("")+`<div class="mute">ممنوع العمل عليه أكثر من الذرة المسموحة اليوم.</div>`;
  return `<div class="card"><div class="mute">💭</div><b>${esc(d.text)}</b>${b}</div>`;
}
function pDreams(){
  let h=head("💭 حاضنة الأحلام")+`<p class="mute">اكتب أي رغبة أو شيء تريد تعلمه. تُقفل 72 ساعة حتى يهدأ الاندفاع، ثم نفحصها: واقعية أم ضخمة؟ ونفككها لذرات صغيرة.</p>

function checkDreams(){let ch=false;S.dreams.forEach(d=>{if(d.state==="incubating"&&Date.now()-d.at>=DREAM_MS){d.state="ready";ch=true}});
  if(ch){save();beep(3);try{new Notification("انتهت 72 ساعة لأحد أحلامك",{body:"افتح الحاضنة"})}catch(e){}render();if(PG==="dreams")drawPanel()}}
async function analyzeDream(d){
  d.state="analyzing";save();drawPanel();
  if(aiOn()){try{await agent(`حلم المستخدم بعد 72 ساعة وما زال يريده: "${d.text}" (dream_id=${d.id}). حلّله: هل هو واقعي مع جدوله (دوام 7ص–4م + جيم) أم ضخم أم هروب من مهام اليوم؟ ثم فكّكه بعقلية الكل أو لا شيء إلى حتى 3 ذرات ميكروية، كل ذرة ≤10 دقائق في يوم محدد. نفّذ ذلك باستدعاء resolve_dream.`,false)}catch(e){d.err=e.message}}
  if(d.state!=="active"){d.state="active";d.verdict="unrated";
    d.reason=aiOn()?"تعذّر التحليل الآلي ("+(d.err||"")+"). قيّمه بنفسك: هل يتسع له جدولك؟":"لم يُفعَّل المدرب الذكي. قيّمه بنفسك: هل يتسع له جدولك؟ ابدأ بذرة صغيرة.";
    d.steps=[{text:"اكتب أول خطوة صغيرة لهذا الحلم",minutes:10,when:"الخميس بعد حصة الإنجليزية"}]}
  save();if(PG==="dreams")drawPanel();render();
}

/* ---- التقرير الأسبوعي ---- */
function wkKey(){return Math.floor((Math.floor(Date.now()/864e5)+3)/7)}
function weeklyStats(){
  const st={days:0,moves:0,gym:0,clinic:0,full:0,mid:0,rescue:0,skipped:0,shutdown:0,fuelDays:0,sos:0,sosWins:0,perBlock:{}};
  for(let i=0;i<7;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const x=S.days[dkey(dt)];if(!x)continue;st.days++;
    for(const[id,r]of Object.entries(x.blocks)){if(r.status==="done"){st[r.mode]++;st.perBlock[id]=(st.perBlock[id]||0)+1;if(id==="gym")st.gym++;if(id==="clinic")st.clinic++;if(id==="shutdown")st.shutdown++}
      else{st.skipped++;st.perBlock["skipped_"+id]=(st.perBlock["skipped_"+id]||0)+1}}
    if((x.fuel||[]).filter(Boolean).length>=3)st.fuelDays++;st.moves+=x.moves||0;st.sos+=x.sos||0;st.sosWins+=x.sosWins||0}
  return st}
function localNarrative(st){const L=[];
  if(st.gym+st.clinic>0)L.push(`🏋️ ${st.gym+st.clinic} حصة حركة هذا الأسبوع: النشاط المنتظم يرفع BDNF (يدعم التركيز والتعافي) ويحسّن حساسية الإنسولين تدريجياً مع الاستمرار.`);
  if(st.shutdown>0)L.push(`🌙 ${st.shutdown} ليالٍ بإغلاق منظّم: النوم المنتظم يخفض الكورتيزول ويساعد الدماغ على تثبيت الذاكرة وتنظيم المشاعر، وهو داعم لاستقرار الأعراض مع علاجك.`);
  if(st.fuelDays>0)L.push(`⛽ ${st.fuelDays} أيام وقود شبه مكتمل: الانتظام في البروتين والوجبات يقلل نوبات الجوع الشره المرتبطة بهبوط السكر.`);
  if(st.moves>0)L.push(`🚶 ${st.moves} استراحة حركة أثناء العمل: المشي القصير بعد الجلوس الطويل ينشّط الدورة الدموية ويخفف خمول الجسد.`);
  if(st.sosWins>0)L.push(`🌊 عبرتَ ${st.sosWins} موجة رغبة بنجاح. كل موجة تمر تُضعف مسار الاندفاع في الدماغ.`);
  if(st.rescue>0)L.push(`🔴 استخدمت وضع الإنقاذ ${st.rescue} مرة. هذا ليس فشلاً: ما يبني العادة هو الاستمرار لا الكمية.`);
  if(!L.length)L.push("لا بيانات كافية هذا الأسبوع بعد. حصة إنقاذ واحدة كل يوم تكفي لبدء السلسلة.");
  L.push("(ملاحظة: هذه آليات عامة وليست قياسات طبية لجسدك.)");return L}
function pWeekly(){
  const st=weeklyStats(),W=S.weekly[wkKey()]||{},reward=W.reward||REWARDS[wkKey()%REWARDS.length];

    <div>🟡 متوسطة: <b>${st.mid}</b></div><div>🔴 إنقاذ: <b>${st.rescue}</b></div>
    <div>🏋️ حركة: <b>${st.gym+st.clinic}</b></div><div>🌙 إغلاق: <b>${st.shutdown}</b></div></div></div>
   <div class="card"><h2>🧬 ماذا حدث داخل جسدك ومخك هذا الأسبوع؟</h2>${lines.map(x=>`<p class="pre">${esc(x)}</p>`).join("")}</div>
   <div class="card"><h2>🎁 مكافأتك الحسية</h2><div style="font-size:18px">${esc(reward)}</div></div>`;
  if(aiOn())h+=`<p><button class="primary" id="wkAi">🤖 تقرير المدرب + تعديل خطة الأسبوع القادم</button></p>`;
  setPg(h);
  if($("wkAi"))$("wkAi").onclick=async()=>{$("wkAi").textContent="⏳ …";$("wkAi").disabled=true;
    try{await agent(`هذه نتائج أسبوعي: ${JSON.stringify(st)}. اكتب تقرير احتفال بلغة تحليلية مختصرة: حوّل التزامي لحقائق فسيولوجية عامة ومتحفظة تعتمد فقط على هذه الأرقام (لا تخترع أرقاماً)، ثم اقترح مكافأة حسية صغيرة تناسب الدايت واحفظ ذلك بـ save_weekly_report. بعدها عدّل مدد الحصص للأسبوع القادم بـ set_block_minutes حيث تظهر حصة تفشل باستمرار (skipped) أو وضع الإنقاذ يغلب، دون زيادة أي شيء.`,false)}catch(e){alert("تعذّر: "+e.message)}
    drawPanel();confetti()};
}
function confetti(){
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;z-index:40;pointer-events:none";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext("2d"),cols=["#3fbf7f","#e6b94a","#5b9cf0","#e5604d","#fff"],P=[];
  for(let i=0;i<140;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:4+Math.random()*6,c:cols[i%5],r:Math.random()*6});
  const t0=Date.now();(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(Date.now()-t0<3500)requestAnimationFrame(f);else c.remove()})();
}

function checkReminders(){
  if(!S.rem.on||!notifOK())return;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),f=remFired(),d=day();let ch=false;
  remList().forEach(r=>{
    if(r.move||r.med||r.on===0||r.on===false)return;
    if(r.days&&!r.days.includes(now.getDay()))return;
    const t=toMin(r.time);if(nm<t||nm>=t+20||f.ids[r.id])return;
    f.ids[r.id]=1;ch=true;
    if(r.blocks&&r.blocks.some(b=>d.blocks[b]))return;           // الحصة منجزة/محسومة: لا إزعاج
    if(r.chk!==undefined&&d.checks.length>r.chk)return;          // سجّلت حالتك بالفعل
    const[tt,bb]=remText(r.id);showNote(tt,bb,today()+r.id);
  });
  if(ch)try{localStorage.setItem("train.fired",JSON.stringify(f))}catch(e){}
}

  S.dreams.filter(d=>d.state==="dropped"||d.state==="active").forEach(d=>o.push({k:dkey(new Date(d.at)),ic:"💭",t:(d.state==="dropped"?"تركت نزوة دون ذنب: ":"فحصت حلماً بواقعية: ")+d.text.slice(0,60)}));
  S.ocd.filter(x=>x.a!=null&&x.a<x.b).forEach(x=>o.push({k:dkey(new Date(x.at)),ic:"🛡️",t:`انتظرت فكرة ملحّة فانخفضت شدتها ${x.b}←${x.a}`}));

function docSummary(){
  const D=14,now=Date.now();let act=0,done=0,skip=0,sos=0,sw=0,mv=0,exp=0,tk=0,sl=0,slPoor=0;
  lastDays(D).forEach(({x})=>{if(!x)return;act++;Object.values(x.blocks||{}).forEach(b=>b.status==="done"?done++:skip++);sos+=x.sos||0;sw+=x.sosWins||0;mv+=x.moves||0;
    exp+=S.meds.length;tk+=S.meds.filter(m=>(x.meds||{})[m.id]).length;if(x.sleep!=null){sl++;if(x.sleep<=1)slPoor++}});
  const c=checkins(D),o=S.ocd.filter(x=>x.at>now-D*864e5),oa=o.filter(x=>x.a!=null),m=k=>f1(avg(c.filter(x=>x[k]).map(x=>x[k])));
  const L=[`ملخص آخر ${D} يوماً من تطبيق «قطار اليوم» — ${today()}`,`(بيانات ذاتية التسجيل، للنقاش وليست قياساً طبياً)`,"",`أيام مسجّلة: ${act}`,`الحصص: ${done} منجزة، ${skip} مؤجلة`,`استراحات حركة أثناء العمل: ${mv}`];
  if(S.meds.length)L.push(`تسجيل الأدوية/المكملات: ${exp?Math.round(tk*100/exp):0}% (${tk}/${exp})`);
  if(sl)L.push(`النوم المسجّل: ${sl} ليلة، منها ${slPoor} أقل من 6 ساعات`);
  if(c.length)L.push(`الحالة (${c.length} تسجيلاً): طاقة ${m("e")}/5 · تركيز ${m("f")}/5 · توتر ${m("s")}/5 (الأعلى أصعب)`);
  L.push(`زر الطوارئ: ${sos} مرة، عُبرت منها ${sw}`);
  if(o.length)L.push(`أفكار ملحّة مسجّلة: ${o.length}`+(oa.length?` — متوسط الشدة قبل ${f1(avg(oa.map(x=>x.b)))} وبعد ${f1(avg(oa.map(x=>x.a)))} (من 10)`:""));
  return L.join("\n")+(S.docQs.trim()?"\n\nأسئلتي للطبيب:\n"+S.docQs.trim():"")}

const PINK="train.pin";
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return"x"+h}}
function pinData(){try{return JSON.parse(localStorage.getItem(PINK))}catch(e){return null}}
function lockNow(){
  const p=pinData();if(!p)return;const ov=$("lock");ov.classList.add("show");
  $("lockIn").innerHTML=`<div style="font-size:44px;margin-top:12vh">🔐</div><h1>قطار اليوم</h1><input id="lockPin" type="password" inputmode="numeric" placeholder="الرمز" style="width:100%;text-align:center;font-size:22px;margin:16px 0"><button class="primary" id="lockGo">فتح</button><div class="mute" id="lockMsg" style="margin-top:8px"></div>`;
  const go=async()=>{if(await sha($("lockPin").value+p.s)===p.h){ov.classList.remove("show");$("lockIn").innerHTML=""}else{$("lockMsg").textContent="رمز غير صحيح";$("lockPin").value=""}};
  $("lockGo").onclick=go;$("lockPin").onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>{const i=$("lockPin");if(i)i.focus()},50)}

const SYSTEM=`أنت المدرب السلوكي داخل تطبيق «قطار اليوم» لمستخدم لديه ADHD وOCD وPTSD ويتابع علاجاً مع طبيب نفسي. أسلوبك: تحليلي مباشر ومختصر بلغة «تقرير كفاءة النظام» دون عبارات عاطفية مبتذلة، إلا إن طلب غير ذلك في ملفه.
المبادئ:
1) نفّذ بالأدوات بدل النصائح الإنشائية حين يمكن (set_block_mode, postpone_block, set_block_minutes, show_message...). ثم لخّص ما نفّذته في سطرين.
2) عند الإرهاق خفّف ولا تزد مهام: حصة إنقاذ منجزة أفضل من إلغاء. لا تزد أي مدة إلا بطلب صريح.
3) فكّك الأهداف الكبيرة إلى ذرات ≤10–15 دقيقة (عقلية الكل أو لا شيء).
4) لا تشخّص ولا تعدّل أو تنصح بتعديل الأدوية والجرعات؛ أحِل أي سؤال دوائي أو أعراض جانبية مقلقة إلى الطبيب.
5) عند أي إشارة لإيذاء النفس: اطلب بهدوء التواصل الفوري مع الطبيب أو الطوارئ ولا تنفّذ أي تعديلات.
6) أي ادعاء صحي يكون عاماً ومتحفظاً ومبنياً على الأرقام الواردة في السياق فقط؛ لا تخترع أرقاماً (سعرات، نسب).
7) اقرأ الملف (profile) قبل أي توصية وراعِ نمط مخاطبته المفضّل. أجب بالعربية وباختصار.`;

  if(name==="postpone_block"){const b=B().find(x=>x.id===i.block_id);if(!b)return"الحصة غير موجودة اليوم";const d=day();if(d.blocks[b.id])return"الحصة محسومة بالفعل";
    d.blocks[b.id]={status:"skipped",mode:"rescue"};save();acts.push(`تأجيل: ${b.name}`);return"تم"}
  if(name==="set_block_minutes"){if(!BIDS.includes(i.block_id)||!MODES[i.mode])return"مدخل غير صالح";const m=Math.min(60,Math.max(1,Math.round(+i.minutes)));
    S.over.mins[i.block_id]=S.over.mins[i.block_id]||{};S.over.mins[i.block_id][i.mode]=m;save();acts.push(`${i.block_id}/${MODES[i.mode].label} = ${m} دقيقة`);return"تم"}
  if(name==="resolve_dream"){const d=S.dreams.find(x=>x.id==i.dream_id);if(!d)return"حلم غير موجود";
    d.verdict=["realistic","huge","escape"].includes(i.verdict)?i.verdict:"unrated";d.reason=String(i.reasoning||"").slice(0,1200);
    d.steps=(i.micro_steps||[]).slice(0,3).map(x=>({text:String(x.text||"").slice(0,200),minutes:Math.min(15,Math.max(1,Math.round(+x.minutes||10))),when:String(x.when||"").slice(0,80)}));
    d.state="active";save();acts.push("تحليل حلم");return"تم"}
  if(name==="save_weekly_report"){S.weekly[wkKey()]={narrative:String(i.narrative||"").slice(0,2000),reward:String(i.reward||"").slice(0,200)};save();acts.push("حفظ تقرير الأسبوع");return"تم"}
  if(name==="show_message"){S.coachMsg={text:String(i.text||"").slice(0,300),day:today()};save();acts.push("رسالة على الصفحة الرئيسية");return"تم"}
  if(name==="classify_note"){const n=S.notes.find(x=>x.id==i.note_id);if(!n)return"ملاحظة غير موجودة";
    n.cat=["task","idea","worry"].includes(i.category)?i.category:undefined;
    if(i.micro_step&&i.micro_step.text)n.step={text:String(i.micro_step.text).slice(0,200),minutes:Math.min(15,Math.max(1,Math.round(+i.micro_step.minutes||10)))};
    if(i.make_dream&&n.cat==="idea")S.dreams.push({id:nid(),text:(n.title||noteText(n)).slice(0,300),at:Date.now(),state:"incubating"});
    n.upd=Date.now();save();acts.push("تصنيف ملاحظة"+(i.make_dream?" + حاضنة الأحلام":""));return"تم"}
  if(name==="set_floor"){if(!FLOOR_IDS.includes(i.block_id))return"حصة غير صالحة";day().floor=i.block_id;save();acts.push("الحد الأدنى المضمون: "+i.block_id);return"تم"}
  return"أداة غير معروفة"}catch(e){return"خطأ: "+e.message}}
async function agent(userText,useHist){
  const sys=SYSTEM+"\n\n# السياق الحالي (JSON)\n"+JSON.stringify(aiContext());
  let msgs;
  if(useHist){msgs=HIST.filter(m=>m.text!=="…").slice(-10).map(m=>({role:m.role,content:m.text}));while(msgs.length&&msgs[0].role!=="user")msgs.shift()}
  else msgs=[{role:"user",content:userText}];
  const acts=[];let text="";
  for(let k=0;k<6;k++){
    const j=await claude(sys,msgs);
    msgs.push({role:"assistant",content:j.content});
    text=j.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const calls=j.content.filter(b=>b.type==="tool_use");
    if(!calls.length||j.stop_reason!=="tool_use")break;
    msgs.push({role:"user",content:calls.map(c=>({type:"tool_result",tool_use_id:c.id,content:runTool(c.name,c.input||{},acts)}))});
  }
  render();return{text,acts};
}
function pCoach(){
  let h=head("🤖 المدرب (ينفّذ ولا يكتفي بالكلام)");
  if(!aiOn())h+=`<div class="msg">فعّل مفتاح Anthropic من ⚙️ الإعدادات في الصفحة الرئيسية أولاً.</div>`;
  h+=`<div>`+HIST.map(m=>`<div class="bub ${m.role}">${esc(m.text)}${(m.acts||[]).map(a=>`<div class="act">⚙️ ${esc(a)}</div>`).join("")}</div>`).join("")+`</div>
   <div class="row wrap" style="margin:8px 0"><button class="small" data-chip="أنا مرهق جداً اليوم">مرهق اليوم</button><button class="small" data-chip="أنهيت الجيم بنجاح اليوم، ماذا أفاد جسدي؟">أنهيت الجيم</button><button class="small" data-chip="هل حصصي الحالية ثقيلة؟ عدّلها للأسبوع القادم إن لزم">راجع خطتي</button></div>
   <textarea id="cIn" placeholder="اكتب للمدرب..."></textarea><p><button class="primary" id="cSend">إرسال</button></p>`;
  setPg(h);
  $("pgIn").querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>sendCoach(b.dataset.chip));
  $("cSend").onclick=()=>sendCoach($("cIn").value.trim());
}
async function sendCoach(text){
  if(BUSY||!text)return;if(!aiOn()){PG="coach";drawPanel();return}
  BUSY=true;HIST.push({role:"user",text});HIST.push({role:"assistant",text:"…"});PG="coach";drawPanel();
  try{const r=await agent(text,true);HIST[HIST.length-1]={role:"assistant",text:r.text||"تم.",acts:r.acts}}
  catch(e){HIST[HIST.length-1]={role:"assistant",text:"تعذّر الاتصال: "+e.message}}
  BUSY=false;if(PG==="coach")drawPanel();
}

/* ============ المزامنة (Supabase REST، اختيارية) ============ */
let pushT=null,pulling=false;
function syncOn(){return S&&S.sync&&S.sync.url&&S.sync.key&&S.sync.id}
function hdr(){return{apikey:S.sync.key,Authorization:"Bearer "+S.sync.key,"Content-Type":"application/json"}}
function pushSoon(){if(!syncOn())return;clearTimeout(pushT);pushT=setTimeout(pushNow,800)}
function syncData(){const{run,sos,sel,sync,ai,...rest}=S;return rest}
async function pushNow(){if(!syncOn())return;
  try{await fetch(S.sync.url+"/rest/v1/train_state",{method:"POST",headers:{...hdr(),Prefer:"resolution=merge-duplicates"},
    body:JSON.stringify({id:S.sync.id,data:syncData(),updated_at:new Date().toISOString()})})}catch(e){}
  try{await fetch(S.sync.url+"/rest/v1/user_neuro_profile",{method:"POST",headers:{...hdr(),Prefer:"resolution=merge-duplicates"},
    body:JSON.stringify({id:S.sync.id,profile:S.profile||{},answered:totalAnswered(),updated_at:new Date().toISOString()})})}catch(e){}}
function doneCount(x){return Object.values((x.days&&x.days[today()]||{blocks:{}}).blocks).filter(b=>b.status==="done").length}
async function pullNow(){if(!syncOn()||pulling)return;pulling=true;
  try{const r=await fetch(S.sync.url+"/rest/v1/train_state?id=eq."+encodeURIComponent(S.sync.id)+"&select=data",{headers:hdr()});
    const rows=await r.json();
    if(!rows.length){await pushNow();return}
    const rd=rows[0].data;
    if((rd.updatedAt||0)>(S.updatedAt||0)){
      const before=doneCount(S),keep={run:S.run,sos:S.sos,sel:S.sel,sync:S.sync,ai:S.ai};
      S=Object.assign({},rd,keep);norm();
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      render();
      if(doneCount(S)>before){const c=currentBlock();beep(3);
        try{new Notification("انتهت حصة على جهاز آخر",{body:c?"الحصة التالية: "+c.name:"انتهى قطار اليوم"})}catch(e){}}
    }else if((rd.updatedAt||0)<(S.updatedAt||0)){await pushNow()}
  }catch(e){}finally{pulling=false}}
setInterval(pullNow,6000);
